<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jig editor</title>
<style>
  :root {
    --bg: #16171a; --panel: #1e2025; --line: #2e3138;
    --text: #e6e7ea; --dim: #8b8f98; --accent: #6ea8fe; --warn: #e0a34a; --bad: #e06a6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid;
    grid-template-columns: 260px 1fr 300px; grid-template-rows: 44px 1fr;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", sans-serif;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
    padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; }
  header .spacer { flex: 1; }
  #status { color: var(--dim); font-size: 12px; }
  #status.bad { color: var(--bad); }
  #status.good { color: var(--accent); }

  aside { background: var(--panel); overflow-y: auto; padding: 10px; }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); }
  main { position: relative; }
  canvas { display: block; }

  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--dim); margin: 16px 0 6px; font-weight: 600;
  }
  h2:first-child { margin-top: 0; }

  button {
    font: inherit; color: var(--text); background: #2a2d34;
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; cursor: pointer;
  }
  button:hover { background: #343841; }
  button.primary { background: var(--accent); color: #10131a; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }

  .row { display: flex; gap: 6px; align-items: center; }
  .row + .row { margin-top: 6px; }

  ul { list-style: none; margin: 0; padding: 0; }
  li.item {
    padding: 5px 8px; border-radius: 5px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  li.item:hover { background: #282b32; }
  li.item.sel { background: #2f3d55; }
  li.item .idx { color: var(--dim); font-variant-numeric: tabular-nums; }
  li.item .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.item .del { color: var(--dim); padding: 0 3px; }
  li.item .del:hover { color: var(--bad); }

  input[type=text], input[type=number], textarea {
    width: 100%; font: inherit; color: var(--text); background: #16181d;
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px;
  }
  textarea { resize: vertical; min-height: 46px; }
  label.field { display: block; margin-top: 8px; }
  label.field span { display: block; color: var(--dim); font-size: 11px; margin-bottom: 3px; }

  .path {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    background: #16181d; border: 1px solid var(--line); border-radius: 5px;
    padding: 5px 7px; word-break: break-all; user-select: all;
  }
  .vec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .empty { color: var(--dim); font-style: italic; }
  .note { color: var(--warn); font-size: 12px; margin-top: 8px; }
  kbd {
    background: #2a2d34; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; font-family: inherit; font-size: 11px;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<header>
  <h1>Jig editor</h1>
  <span id="jigTitle" class="empty">no jig loaded</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="validate">Validate</button>
  <button id="save" class="primary" disabled>Save</button>
</header>

<aside class="left">
  <h2>Jigs</h2>
  <ul id="jigList"></ul>
  <div class="row" style="margin-top:8px">
    <button id="addModel">Add model…</button>
    <input type="file" id="glbInput" accept=".glb" hidden>
  </div>

  <h2>Steps</h2>
  <ul id="stepList"></ul>
  <div class="row" style="margin-top:8px">
    <button id="addStep">Add step</button>
    <button id="dupStep">Duplicate</button>
  </div>

  <h2>Jig</h2>
  <label class="field"><span>Scale</span><input type="number" id="scale" step="0.005" min="0.001"></label>

  <h2>Step detail</h2>
  <label class="field"><span>Caption</span><textarea id="caption"></textarea></label>
  <label class="field"><span>Duration (s)</span><input type="number" id="duration" step="0.1" min="0"></label>
</aside>

<main id="viewport"></main>

<aside class="right">
  <h2>Selection</h2>
  <div id="selNone" class="empty">click a part in the viewport</div>
  <div id="selBody" hidden>
    <div class="path" id="selPath"></div>
    <label class="field">
      <span>Move — offset from rest, Unity space</span>
      <div class="vec">
        <input type="number" id="mx" step="0.1"><input type="number" id="my" step="0.1"><input type="number" id="mz" step="0.1">
      </div>
    </label>
    <div class="row" style="margin-top:8px">
      <label class="row" style="gap:5px"><input type="checkbox" id="visible"> visible</label>
      <span class="spacer" style="flex:1"></span>
      <button id="clearNode">Reset in step</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="addLabel">Add label here</button>
    </div>
  </div>

  <h2>Labels in this step</h2>
  <ul id="labelList"></ul>
  <div id="labelBody" hidden>
    <label class="field"><span>Text</span><input type="text" id="labelText"></label>
    <label class="field">
      <span>Offset from anchor — Unity space</span>
      <div class="vec">
        <input type="number" id="lx" step="0.1"><input type="number" id="ly" step="0.1"><input type="number" id="lz" step="0.1">
      </div>
    </label>
  </div>

  <h2>Callouts in this step</h2>
  <ul id="calloutList"></ul>
  <div class="row" style="margin-top:8px">
    <button id="addCallout">Add callout</button>
  </div>
  <div id="calloutBody" hidden>
    <label class="field"><span>Title</span><input type="text" id="coTitle"></label>
    <label class="field"><span>Body</span><textarea id="coBody"></textarea></label>
    <label class="field"><span>Width (model units)</span><input type="number" id="coWidth" step="0.5" min="0.1"></label>
    <label class="field">
      <span>Offset — Unity space</span>
      <div class="vec">
        <input type="number" id="cx" step="0.1"><input type="number" id="cy" step="0.1"><input type="number" id="cz" step="0.1">
      </div>
    </label>
    <div class="row" style="margin-top:8px">
      <label class="row" style="gap:5px"><input type="checkbox" id="coAnchored"> anchored</label>
    </div>
  </div>

  <div id="notes"></div>

  <h2>Keys</h2>
  <div style="color:var(--dim)">
    <kbd>G</kbd> move gizmo · <kbd>Esc</kbd> deselect<br>
    <kbd>←</kbd> <kbd>→</kbd> step · <kbd>⌘S</kbd> save
  </div>
</aside>

<script type="module" src="./editor.js"></script>
</body>
</html>
